server:
  port: 8080   # Disaridan gelen TUM istekler artik buraya gelir

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # /api/books/** -> Eureka'daki "book-service" orneklerine (load balanced)
            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/api/books/**

            # /api/borrowings/** -> Eureka'daki "borrowing-service" orneklerine
            - id: borrowing-service
              uri: lb://borrowing-service
              predicates:
                - Path=/api/borrowings/**

          # Tarayici tabanli bir frontend (React/Angular vb.) icin CORS
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "http://localhost:*"
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
