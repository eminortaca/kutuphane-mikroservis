server:
  port: 8080   # Disaridan gelen TUM istekler artik buraya gelir

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Istemcinin gonderdigi Host basligini (localhost:8080) servislere aynen ilet.
          # Boylece servislerin urettigi adresler (orn. 201 Created -> Location) servisin kendi
          # adresini (makine-adi:8081) degil, Gateway adresini (localhost:8080) gosterir.
          default-filters:
            - PreserveHostHeader
          routes:
            # GUVENLIK NOTU: Servisler arasi uc noktalar (/internal/**) icin bilerek ROTA YOK.
            # Ornegin book-service'teki /internal/books/{id}/decrease-stock disaridan 8080 uzerinden
            # cagrilamaz (404). Sadece borrowing-service, Eureka uzerinden dogrudan cagirir.

            # /api/books/** -> Eureka'daki "book-service" orneklerine (load balanced)
            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/api/books/**

            # /api/borrowings/** -> Eureka'daki "borrowing-service" orneklerine
            - id: borrowing-service
              uri: lb://borrowing-service
              predicates:
                - Path=/api/borrowings/**

            # /api/members/** -> Eureka'daki "member-service" orneklerine
            - id: member-service
              uri: lb://member-service
              predicates:
                - Path=/api/members/**

          # Tarayici tabanli bir frontend (React/Angular vb.) icin CORS
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "http://localhost:*"
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
                allowed-headers: "*"
                exposed-headers: [X-Correlation-Id, X-Total-Count, X-Total-Pages, Location]

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only

security:
  jwt:
    secret: ${JWT_SECRET:kutuphane-mikroservis-gizli-anahtar-en-az-32-karakter-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
