spring.application.name=book-service
server.port=8081

# H2 Veritabanı Ayarları (Bellek içi)
spring.datasource.url=jdbc:h2:mem:bookdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# --- ACTUATOR (Sağlık kontrolü) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# API Gateway'in eklediği X-Forwarded-* başlıklarını dikkate al.
# Böylece 201 Created cevabındaki Location adresi servisin kendi portunu (808x) değil,
# Gateway adresini (localhost:8080) gösterir.
server.forward-headers-strategy=framework

# --- SERVİSLER ARASI GÜVENLİK (Internal API Secret) ---
internal.api.secret=${INTERNAL_API_SECRET:kutuphane-internal-secret-2026}
