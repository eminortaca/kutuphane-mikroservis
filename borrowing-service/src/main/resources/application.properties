spring.application.name=borrowing-service
server.port=8082

# Borrowing-Service'in KENDİ bağımsız veritabanı (bookdb değil, borrowingdb!)
spring.datasource.url=jdbc:h2:mem:borrowingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- FEIGN ZAMAN AŞIMLARI ---
# Book-Service'e bağlanma en fazla 2 sn, cevap bekleme en fazla 3 sn sürsün (sonsuza kadar beklemesin)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# --- DEVRE KESİCİ (Circuit Breaker) ---
# Feign çağrılarını Resilience4j devre kesicisi ile sar. Ayrıntılı ayarlar: ResilienceConfig.java
spring.cloud.openfeign.circuitbreaker.enabled=true
# --- ACTUATOR (Sağlık kontrolü) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# API Gateway'in eklediği X-Forwarded-* başlıklarını dikkate al.
# Böylece 201 Created cevabındaki Location adresi servisin kendi portunu (808x) değil,
# Gateway adresini (localhost:8080) gösterir.
server.forward-headers-strategy=framework

# --- ÖDÜNÇ ALMA İŞ KURALLARI ---
borrowing.default-duration-days=14
borrowing.renew-duration-days=7
borrowing.max-active-per-member=3
borrowing.daily-late-fee=5.0

# --- SERVİSLER ARASI GÜVENLİK (Internal API Secret) ---
internal.api.secret=${INTERNAL_API_SECRET:kutuphane-internal-secret-2026}

