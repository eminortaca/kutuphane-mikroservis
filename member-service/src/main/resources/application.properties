spring.application.name=member-service
server.port=8083

# Member-Service kendi bağımsız veritabanını kullanır (memberdb)
spring.datasource.url=jdbc:h2:mem:memberdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- ACTUATOR (Sağlık kontrolü) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# API Gateway'in eklediği X-Forwarded-* başlıklarını dikkate al.
server.forward-headers-strategy=framework
