spring.application.name=member-service
server.port=8083

# Member-Service kendi bağımsız veritabanını kullanır (memberdb)
spring.datasource.url=jdbc:h2:mem:memberdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- ACTUATOR (Sağlık kontrolü) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# API Gateway'in eklediği X-Forwarded-* başlıklarını dikkate al.
server.forward-headers-strategy=framework

# --- İSTEK TAKİBİ (X-Correlation-Id) ---
logging.pattern.level=%5p [cid=%X{correlationId:-none}]
